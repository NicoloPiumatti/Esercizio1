<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio 1</title>
    <link rel="stylesheet" href="CSS/form.css">
    <script src="JS/form.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Guida Turistica</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="visita.html">Cosa vedere</a>
                <a class="nav-link" href="itinerario.html">Itinerario</a>
                <a class="nav-link" href="contatti.html">Contatti</a>
                <a class="nav-link active" href="#">Form</a>
            </div>
        </div>
    </nav>
    <div class="p-3">
        <h1 class="mt-3 text-center fw-bold m-3">Form</h1>
        <p class="h5 text-center">Compila il form inserendo le tue informazioni e attendi una risposta</p>
    </div>
    <form id="form" class="p-3 m-3">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome:</label>
            <input type="text" id="nome" name="nome" class="form-control">
        </div>
        <div class="mb-3">
            <label for="cognome" class="form-label">Cognome:</label>
            <input type="text" id="cognome" name="cognome" class="form-control">
        </div>
        <div class="mb-3"> 
            <label for="email" class="form-label">Email:</label> 
            <input type="email" id="email" name="email" class="form-control"> 
        </div>
        <div class="mb-3"> 
            <label for="richiesta" class="form-label">Tipo di richiesta:</label> 
            <select id="richiesta" name="richiesta" class="form-select">
                <option value="informazioni">Richiesta informazioni</option>
                <option value="prenotazione">Prenotazione visita</option>
                <option value="escursioni">Escursioni guidate</option>
                <option value="eventi">Eventi</option>
                <option value="altro">Altro</option>
            </select> 
        </div>
        <div class="mb-3"> 
            <label for="messaggio" class="form-label">Messaggio:</label> 
            <textarea id="messaggio" name="messaggio" class="form-control" rows="4" placeholder="Scrivi il tuo messaggio"></textarea> 
        </div>
        <div class="mb-3 form-check"> 
            <input type="checkbox" id="privacy" name="privacy" class="form-check-input">
            <label for="privacy" class="form-check-label"> Accetto il trattamento dei dati personali. </label>
        </div>
        <div class="mb-3"> 
            <button type="button" class="btn btn-primary" onclick="visForm()">Invia e visualizza form</button>
        </div>
    </form>
    <footer class="bg-dark text-white text-center p-3">
        <a href="https://www.vallemaira.org">&copy; 2026 - Guida Turistica Valle Maira</a>
    </footer>
</body>

</html>
